{% set name = "edgetest-pip-tools" %}
{% set version = "2026.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c16c748a1de4cfae27c11dcbef849515786d86d58d808c19085f55f187a2132d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install -vv --no-deps .

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64.0.0
  run:
    - edgetest >=2024.4.0
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - edgetest_pip_tools.plugin

about:
  home: https://github.com/capitalone/edgetest-pip-tools
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: edgetest-pip-tools is a pip-tools plugin for edgetest
  description: |
    This plugin will refresh requirements.txt using pip-tools when using edgetest
  doc_url: https://capitalone.github.io/edgetest-pip-tools/
  dev_url: https://github.com/capitalone/edgetest-pip-tools

extra:
  recipe-maintainers:
    - jdawang
    - gladysteh99
    - fdosani
    - ak-gupta
